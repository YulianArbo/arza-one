packages:
  - apps/*
  - packages/*
  - infra/scripts
  - infra/migrate
# Variables de entorno en los scripts (VAR=valor comando) también en Windows (B04).
shellEmulator: true
allowBuilds:
  lefthook: true
  # Prisma descarga su motor de migraciones al instalarse (B03).
  prisma: true
  '@prisma/engines': true
  # Telemetría de swagger-ui-dist: no se permite ejecutar su script de instalación.
  '@scarf/scarf': false
  # Complementos nativos opcionales de Testcontainers (conexión SSH a Docker); no se usan.
  cpu-features: false
  ssh2: false
  protobufjs: false
  # Aceleración nativa opcional de msgpackr (la usa BullMQ, B06); sin ella usa JavaScript puro.
  msgpackr-extract: false
# Versiones corregidas de dependencias indirectas con vulnerabilidades altas (B05, osv-scanner).
# Prisma 7.10.0 (la última 7.x) fija las vulnerables. Retirar al actualizar Prisma.
overrides:
  # GHSA-3f6p-5ww8-9rcr y GHSA-rgwj-5xj2-c3m3. Solo lo usa la consola de Prisma con MySQL.
  'prisma>mysql2': 3.24.6
  # GHSA-ggr8-5vv4-36mx. Prisma solo mezcla objetos simples de configuración.
  '@prisma/config>deepmerge-ts': 8.0.2
  # GHSA-7589-6fvf-x4pw (ReDoS en Schema.TemplateLiteral), publicado el 19/11/2026. Prisma 7.10.1
  # fija effect 3.20.0; la 3.22.4 trae la corrección y mantiene la misma versión mayor.
  '@prisma/config>effect': 3.22.5
  # GHSA-q7qp-rjg7-q26m. NestJS 11 fija multer 2.4.0; la 2.5.0 solo trae la corrección.
  '@nestjs/platform-express>multer': 2.5.0
# El sello de los PDF firmados (B43) usa @signpdf/placeholder-plain, que copia lo que necesita de
# pdfkit 0.10 y nunca lo carga. Sin esto pnpm instalaría pdfkit 0.10 y su crypto-js 3 vulnerable.
packageExtensions:
  '@signpdf/placeholder-pdfkit010':
    peerDependenciesMeta:
      pdfkit:
        optional: true
