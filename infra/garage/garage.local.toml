# Garage del entorno local (B06, ADR-013): un solo nodo, sin réplicas.
# Los secretos (rpc_secret y admin_token) no van aquí: llegan por las variables de entorno
# GARAGE_RPC_SECRET y GARAGE_ADMIN_TOKEN desde el archivo .env.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
