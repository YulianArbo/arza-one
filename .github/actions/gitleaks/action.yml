# Instala gitleaks con versión fija y huella verificada (B05). Actualización manual: ver
# docs/runbooks/integracion-continua.md, «Herramientas fijadas».
name: Instalar gitleaks
description: Descarga gitleaks, verifica su huella SHA-256 y lo agrega al PATH.

runs:
  using: composite
  steps:
    - name: gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        mkdir -p "$RUNNER_TEMP/gitleaks"
        curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
        echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
