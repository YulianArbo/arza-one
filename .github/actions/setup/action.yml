# Prepara Node.js, pnpm y las dependencias, igual que en el equipo de desarrollo (B05).
name: Preparar el proyecto
description: Instala Node.js (versión de .nvmrc), pnpm (versión de package.json) y las dependencias.

runs:
  using: composite
  steps:
    - name: pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Dependencias
      shell: bash
      run: pnpm install --frozen-lockfile
