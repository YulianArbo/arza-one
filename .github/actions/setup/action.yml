# Prepara Node.js, pnpm y las dependencias, igual que en el equipo de desarrollo (B05).
name: Preparar el proyecto
description: Instala Node.js (versión de .nvmrc), pnpm (versión de package.json) y las dependencias.

runs:
  using: composite
  steps:
    - name: pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Dependencias
      shell: bash
      run: pnpm install --frozen-lockfile
