# Integración continua (numeral 11.4, ADR-018, bloque B05).
# Corre en cada pull request y en cada cambio a main. Las tareas van en paralelo; la tarea
# «Verificaciones» resume todas y es la que la protección de main exige en verde.
# La verificación 10 (OWASP ZAP) corre aparte, cada semana: ver zap-semanal.yml.
name: Integración continua

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos: solo leer el código. Ninguna tarea usa secretos.
permissions:
  contents: read

# Un cambio nuevo en el mismo pull request cancela la ejecución anterior (ahorra minutos).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Commit de la versión anterior: la rama base del pull request o el commit previo de main.
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  PRISMA_HIDE_UPDATE_MESSAGE: '1'

jobs:
  quality:
    name: 1-3. Formato, análisis, tipos y fronteras
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Mensajes de commit (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: 1. Formato (Prettier)
        run: pnpm format:check
      # El análisis con tipos necesita los tipos compilados de los paquetes compartidos.
      - name: Compilar los paquetes compartidos
        run: pnpm exec turbo run build --filter="./packages/*"
      - name: 1. Análisis estático (ESLint, cero advertencias)
        run: pnpm lint
      - name: 2. Tipos
        run: pnpm typecheck
      - name: 3. Fronteras entre módulos (dependency-cruiser)
        run: pnpm boundaries
      - name: 3. Código sin uso (knip)
        run: pnpm unused

  unit:
    name: 4. Pruebas unitarias con cobertura
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Las pruebas de los controles ejecutan gitleaks de verdad (packages/config).
      - uses: ./.github/actions/gitleaks
      - name: Pruebas unitarias (umbral de cobertura del capítulo 21)
        run: pnpm test

  integration:
    name: 5. Integración con base de datos real
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Pruebas con PostgreSQL 17 (incluye aislamiento entre empresas)
        run: pnpm test:int

  security:
    name: 6. Secretos, seguridad y dependencias
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OSV_SCANNER_VERSION: 2.6.0
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
      SEMGREP_IMAGE: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/gitleaks
      - name: Instalar osv-scanner (versión fija y huella verificada)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/bin/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/osv-scanner"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Secretos en todo el historial (gitleaks)
        run: gitleaks git --no-banner --redact
      - name: Análisis estático de seguridad (Semgrep, hallazgos de severidad alta)
        run: |
          docker run --rm --volume "$PWD:/src" --workdir /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off --error --severity ERROR \
              --config p/typescript --config p/nodejs --config p/owasp-top-ten \
              --config p/dockerfile --config p/github-actions
      - uses: ./.github/actions/setup
      - name: Dependencias vulnerables (osv-scanner; falla con altas o críticas)
        run: |
          # osv-scanner sale con 1 si hay cualquier aviso; el umbral lo aplica el guion.
          status=0
          osv-scanner scan source --config osv-scanner.toml --lockfile pnpm-lock.yaml \
            --format json --output-file "$RUNNER_TEMP/osv.json" || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          node infra/scripts/ci/check-vulnerabilities.ts "$RUNNER_TEMP/osv.json"

  migrations:
    name: 7. Migraciones desde cero y sobre la versión anterior
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Compatibilidad hacia atrás de las migraciones nuevas
        run: node infra/scripts/ci/check-migrations.ts "$BASE_SHA"
      - name: Compilar la API
        run: pnpm exec turbo run build --filter=@arza/api
      - name: Aplicar sobre la versión anterior con sus datos
        run: bash infra/scripts/ci/migrations-upgrade.sh "$BASE_SHA"
      # «Desde cero» lo comprueba la tarea 5: global-setup.ts migra una base vacía.

  images:
    name: 8. Imagen ${{ matrix.app }} y análisis con Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    env:
      TRIVY_VERSION: 0.74.0
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construir la imagen
        run: docker build --file "apps/${{ matrix.app }}/Dockerfile" --tag "arza-one/${{ matrix.app }}:ci" .
      - name: Instalar Trivy (versión fija y huella verificada)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Vulnerabilidades altas y críticas (informativo)
        run: trivy image --quiet --severity HIGH,CRITICAL --ignore-unfixed "arza-one/${{ matrix.app }}:ci"
      - name: Falla con una vulnerabilidad crítica con corrección disponible
        run: trivy image --quiet --skip-db-update --severity CRITICAL --ignore-unfixed --exit-code 1 "arza-one/${{ matrix.app }}:ci"

  e2e:
    name: 9. Pruebas en navegador y accesibilidad
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Navegador Chromium
        run: pnpm --filter @arza/web exec playwright install --with-deps chromium
      - name: Compilar
        run: pnpm build
      - name: Recorridos y accesibilidad (Playwright y axe-core)
        run: pnpm test:e2e
      - name: Guardar las trazas si algo falló
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-trazas
          path: apps/web/test-results
          retention-days: 7

  verifications:
    name: Verificaciones
    if: always()
    needs: [quality, unit, integration, security, migrations, images, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Todas las verificaciones en verde
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "Al menos una verificación no pasó: el cambio no se puede integrar."
              exit 1
            fi
          done
