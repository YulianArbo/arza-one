# Integración continua (numeral 11.4, ADR-018, bloque B05).
# Corre en cada pull request y en cada cambio a main. Las tareas van en paralelo; la tarea
# «Verificaciones» resume todas y es la que la protección de main exige en verde.
# La verificación 10 (OWASP ZAP) corre aparte, cada semana: ver zap-semanal.yml.
#
# Optimización de minutos (ADR-024): la tarea 0 decide qué corre sin quitar ninguna verificación.
# - Pull request de código: tareas 1-9; los ensayos 11 y 12 solo si toca infraestructura.
# - Fusión a main ya verificada en su pull request: seguridad y ensayos 11 y 12.
# - Solo documentación: formato y seguridad.
# Para volver a correr todo siempre: variable de repositorio CI_FULL_RUN=true (Settings → Secrets
# and variables → Actions → Variables). Guía: docs/runbooks/integracion-continua.md.
name: Integración continua

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos: solo leer el código. Ninguna tarea usa secretos.
permissions:
  contents: read

# Un cambio nuevo en el mismo pull request cancela la ejecución anterior (ahorra minutos).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Commit de la versión anterior: la rama base del pull request o el commit previo de main.
  # Lanzada a mano (workflow_dispatch) no hay ninguno de los dos: se compara con main (B07).
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  PRISMA_HIDE_UPDATE_MESSAGE: '1'

jobs:
  plan:
    name: 0. Qué verificar en este cambio
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Leer si la fusión ya pasó «Verificaciones» en su pull request.
      checks: read
    outputs:
      quality: ${{ steps.plan.outputs.quality }}
      tests: ${{ steps.plan.outputs.tests }}
      rehearsals: ${{ steps.plan.outputs.rehearsals }}
      runner: ${{ steps.runner.outputs.labels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Decidir las tareas (ADR-024)
        id: plan
        env:
          CI_FULL_RUN: ${{ vars.CI_FULL_RUN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node infra/scripts/ci/plan-ci.ts "$BASE_SHA"
      # ADR-025: las tareas 1-5 van al runner propio solo si el administrador lo activó y el cambio
      # es del dueño, desde este repositorio. Renovate, forks y otros autores siguen en GitHub.
      - name: Máquina de las tareas 1-5 (ADR-025)
        id: runner
        env:
          LOCAL: >-
            ${{ vars.CI_RUNNER == 'local' && (
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login == github.repository_owner &&
            github.actor == github.repository_owner &&
            github.triggering_actor == github.repository_owner)) }}
        run: |
          if [ "$LOCAL" = 'true' ]; then labels='["self-hosted","Linux","X64"]'; else labels='"ubuntu-24.04"'; fi
          echo "labels=$labels" >> "$GITHUB_OUTPUT"

  quality:
    name: 1-3. Formato, análisis, tipos y fronteras
    needs: plan
    if: needs.plan.outputs.quality == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Mensajes de commit (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: 1. Formato (Prettier)
        run: pnpm format:check
      # El análisis con tipos necesita los tipos compilados de los paquetes compartidos y de la
      # plataforma de la API, que el worker reutiliza (B06).
      - name: Compilar los paquetes compartidos y la API
        run: pnpm exec turbo run build --filter="./packages/*" --filter=@arza/api
      - name: 1. Análisis estático (ESLint, cero advertencias)
        run: pnpm lint
      - name: 2. Tipos
        run: pnpm typecheck
      - name: 3. Fronteras entre módulos (dependency-cruiser)
        run: pnpm boundaries
      - name: 3. Código sin uso (knip)
        run: pnpm unused

  unit:
    name: 4. Pruebas unitarias con cobertura
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Las pruebas de los controles ejecutan gitleaks de verdad (packages/config).
      - uses: ./.github/actions/gitleaks
      - name: Pruebas unitarias (umbral de cobertura del capítulo 21)
        run: pnpm test

  integration:
    name: 5. Integración con base de datos, colas y correo reales
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Pruebas con PostgreSQL 17, Valkey y Mailpit (aislamiento entre empresas y reintentos)
        run: pnpm test:int

  # Corre siempre, incluso si el cambio es solo documentación (un secreto puede estar en cualquier archivo).
  security:
    name: 6. Secretos, seguridad y dependencias
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OSV_SCANNER_VERSION: 2.6.0
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
      SEMGREP_IMAGE: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/gitleaks
      - name: Instalar osv-scanner (versión fija y huella verificada)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/bin/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/osv-scanner"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Secretos en todo el historial (gitleaks)
        run: gitleaks git --no-banner --redact
      - name: Análisis estático de seguridad (Semgrep, hallazgos de severidad alta)
        run: |
          docker run --rm --volume "$PWD:/src" --workdir /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off --error --severity ERROR \
              --config p/typescript --config p/nodejs --config p/owasp-top-ten \
              --config p/dockerfile --config p/github-actions
      - uses: ./.github/actions/setup
      - name: Dependencias vulnerables (osv-scanner; falla con altas o críticas)
        run: |
          # osv-scanner sale con 1 si hay cualquier aviso; el umbral lo aplica el guion.
          status=0
          osv-scanner scan source --config osv-scanner.toml --lockfile pnpm-lock.yaml \
            --format json --output-file "$RUNNER_TEMP/osv.json" || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          node infra/scripts/ci/check-vulnerabilities.ts "$RUNNER_TEMP/osv.json"
      - name: Licencias de lo que se entrega y avisos de terceros (B43)
        run: |
          mkdir -p inventario
          pnpm licenses list --prod --json --recursive > "$RUNNER_TEMP/licenses.json"
          node infra/scripts/ci/check-licenses.ts "$RUNNER_TEMP/licenses.json"             inventario/AVISOS-DE-TERCEROS.md
      - name: Guardar los avisos de terceros
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avisos-de-terceros
          path: inventario/AVISOS-DE-TERCEROS.md
          if-no-files-found: ignore
          retention-days: 90

  migrations:
    name: 7. Migraciones desde cero y sobre la versión anterior
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Compatibilidad hacia atrás de las migraciones nuevas
        run: node infra/scripts/ci/check-migrations.ts "$BASE_SHA"
      - name: Compilar la API
        run: pnpm exec turbo run build --filter=@arza/api
      - name: Aplicar sobre la versión anterior con sus datos
        run: bash infra/scripts/ci/migrations-upgrade.sh "$BASE_SHA"
      # «Desde cero» lo comprueba la tarea 5: global-setup.ts migra una base vacía.

  # Las cuatro imágenes en una sola máquina: comparten capas de Docker y la base de Trivy, y se
  # cobra una tarea en lugar de cuatro (ADR-024). Cada imagen se construye y analiza igual que antes.
  images:
    name: 8. Imágenes api, web, worker y migrate y análisis con Trivy
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # migrate: imagen de migraciones del despliegue (B07), etapa del Dockerfile de la API.
      # postgres: PostgreSQL con pgBackRest de producción (B44).
      APPS: api web worker migrate postgres
      TRIVY_VERSION: 0.74.0
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construir las imágenes
        run: |
          failed=""
          for app in $APPS; do
            bash infra/scripts/ci/build-image.sh "$app" "arza-one/$app:ci" || failed="$failed $app"
          done
          if [ -n "$failed" ]; then echo "No se pudo construir:$failed"; exit 1; fi
      - name: Instalar Trivy (versión fija y huella verificada)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Vulnerabilidades altas y críticas (informativo)
        run: |
          for app in $APPS; do
            echo "::group::Imagen $app"
            trivy image --quiet --severity HIGH,CRITICAL --ignore-unfixed "arza-one/$app:ci"
            echo "::endgroup::"
          done
      - name: Falla con una vulnerabilidad crítica con corrección disponible
        run: |
          failed=""
          for app in $APPS; do
            trivy image --quiet --skip-db-update --severity CRITICAL --ignore-unfixed --exit-code 1 \
              "arza-one/$app:ci" || failed="$failed $app"
          done
          if [ -n "$failed" ]; then echo "Vulnerabilidad crítica con corrección en:$failed"; exit 1; fi
      # Inventario de componentes (SBOM) de cada imagen en formato CycloneDX (numeral 15.5, B43).
      - name: Inventario de componentes (SBOM) de cada imagen
        run: |
          mkdir -p sbom
          for app in $APPS; do
            trivy image --quiet --skip-db-update --format cyclonedx               --output "sbom/$app.cdx.json" "arza-one/$app:ci"
          done
          ls -l sbom
      - name: Guardar el inventario de componentes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom/*.cdx.json
          retention-days: 90

  e2e:
    name: 9. Pruebas en navegador y accesibilidad
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Navegador Chromium
        run: pnpm --filter @arza/web exec playwright install --with-deps chromium
      - name: Compilar
        run: pnpm build
      - name: Recorridos y accesibilidad (Playwright y axe-core)
        run: pnpm test:e2e
      - name: Guardar las trazas si algo falló
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-trazas
          path: apps/web/test-results
          retention-days: 7

  deploy-rehearsal:
    name: 11. Ensayo de despliegue y reversión automática
    needs: plan
    if: needs.plan.outputs.rehearsals == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Este mismo equipo hace de servidor: publica una versión buena y luego una dañada, que
      # debe revertirse sola (criterios de B07).
      - name: Publicar una versión buena y revertir una dañada
        run: bash infra/scripts/deploy/rehearsal.sh

  server-rehearsal:
    name: 12. Preparación y endurecimiento del servidor (Ubuntu 24.04)
    needs: plan
    if: needs.plan.outputs.rehearsals == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Análisis de los guiones de bash (ShellCheck)
        run: shellcheck --external-sources infra/server/*.sh infra/scripts/ci/*.sh infra/scripts/deploy/*.sh infra/postgres/init/*.sh infra/backup/*.sh infra/monitoring/*.sh
      # La máquina de GitHub es un Ubuntu 24.04 desechable: se prepara con provision.sh y se
      # comprueba desde fuera (SSH, root, contraseñas, puertos).
      - name: Preparar este equipo como servidor y comprobarlo
        run: bash infra/server/rehearsal.sh

  backup-rehearsal:
    name: 13. Ensayo de producción, copias y restauración completa
    needs: plan
    if: needs.plan.outputs.rehearsals == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Este mismo equipo hace de servidor de producción: despliega una versión etiquetada, saca
      # todas las copias, borra la base y los archivos, restaura y mide el tiempo contra el RTO
      # (criterios de B44, numerales 10.5 y 10.6).
      - name: Desplegar, copiar, perderlo todo y restaurar
        run: bash infra/backup/rehearsal.sh

  verifications:
    name: Verificaciones
    if: always()
    needs:
      [
        plan,
        quality,
        unit,
        integration,
        security,
        migrations,
        images,
        e2e,
        deploy-rehearsal,
        server-rehearsal,
        backup-rehearsal,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # «Omitida» solo es válido cuando la tarea 0 lo decidió (ADR-024); si la tarea 0 falla, todo
      # falla. Cualquier otra tarea fallida o cancelada impide integrar, igual que antes.
      - name: Todas las verificaciones en verde
        env:
          PLAN: ${{ needs.plan.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Plan: $PLAN · Resultados: $RESULTS"
          if [ "$PLAN" != "success" ]; then
            echo "No se pudo decidir qué verificar: el cambio no se puede integrar."
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Al menos una verificación no pasó: el cambio no se puede integrar."
              exit 1
            fi
          done
