# Verificación 10 del numeral 11.4: análisis dinámico con OWASP ZAP, semanal y a demanda.
# Mientras no exista el servidor de pruebas (B07), analiza una copia temporal de la aplicación
# levantada dentro de GitHub Actions (infra/compose/ci.yml). Falla con alertas de riesgo alto.
name: Análisis dinámico semanal (OWASP ZAP)

on:
  schedule:
    # Lunes 06:00 UTC (01:00 en Bogotá).
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  ZAP_IMAGE: zaproxy/zap-stable:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
  COMPOSE: docker compose --file infra/compose/ci.yml
  PRISMA_HIDE_UPDATE_MESSAGE: '1'

jobs:
  zap:
    name: 10. OWASP ZAP
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Construir las imágenes
        run: |
          docker build --file apps/api/Dockerfile --tag arza-one/api:ci .
          docker build --file apps/web/Dockerfile --tag arza-one/web:ci .
      - name: Contraseñas desechables
        run: |
          for name in POSTGRES_PASSWORD APP_DB_PASSWORD MIGRATION_DB_PASSWORD CSRF_SECRET; do
            value="$(openssl rand -hex 18)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Base de datos y migraciones
        run: |
          $COMPOSE up --detach --wait postgres
          DATABASE_MIGRATION_URL="postgresql://migration_user:${MIGRATION_DB_PASSWORD}@127.0.0.1:5432/arza_one" \
            pnpm db:migrate
      - name: Levantar la API y la web
        # Espera a que la verificación de salud de cada imagen responda.
        run: $COMPOSE up --detach --wait --wait-timeout 180 valkey api web
      - name: Análisis de la web (ZAP baseline)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network arza-one-ci_default --volume "$PWD/zap:/zap/wrk" "$ZAP_IMAGE" \
            zap-baseline.py -t http://web:3000 -J web.json -r web.html -I
      - name: Análisis de la API desde su OpenAPI (ZAP API scan)
        run: |
          docker run --rm --network arza-one-ci_default --volume "$PWD/zap:/zap/wrk" "$ZAP_IMAGE" \
            zap-api-scan.py -t http://api:4000/api/docs/openapi.json -f openapi -J api.json -r api.html -I
      - name: Falla con alertas de riesgo alto
        run: |
          high=$(jq '[.site[]?.alerts[]? | select(.riskcode == "3")] | length' zap/web.json zap/api.json | paste -sd+ | bc)
          jq -r '.site[]?.alerts[]? | "\(.riskdesc): \(.name)"' zap/web.json zap/api.json | sort | uniq -c
          echo "Alertas de riesgo alto: $high"
          test "$high" -eq 0
      - name: Guardar los informes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: informes-zap
          path: zap/*.html
          retention-days: 30
      - name: Apagar
        if: always()
        run: $COMPOSE down --volumes
