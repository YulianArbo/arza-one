# Verificación 10 del numeral 11.4: análisis dinámico con OWASP ZAP, semanal y a demanda.
# Analiza una copia temporal de la aplicación levantada dentro de GitHub Actions
# (infra/compose/ci.yml). Desde B43 la API se analiza también con sesión iniciada: una cuenta de
# análisis con el rol Dirección, creada por invitación y con segundo factor, como una persona.
# Falla con alertas de riesgo alto. Las alertas aceptadas, con su motivo, están en .zap/reglas.tsv.
name: Análisis dinámico semanal (OWASP ZAP)

on:
  schedule:
    # Lunes 06:00 UTC (01:00 en Bogotá).
    - cron: '0 6 * * 1'
  workflow_dispatch:
  # Cuando cambia el propio análisis, se ejecuta en el pull request para comprobarlo.
  pull_request:
    paths:
      - .github/workflows/zap-semanal.yml
      - .github/actions/scan-stack/**
      - .zap/**
      - infra/compose/ci.yml
      - infra/scripts/security/**

permissions:
  contents: read

env:
  ZAP_IMAGE: zaproxy/zap-stable:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
  COMPOSE: docker compose --file infra/compose/ci.yml
  PRISMA_HIDE_UPDATE_MESSAGE: '1'

jobs:
  zap:
    name: 10. OWASP ZAP
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: stack
        uses: ./.github/actions/scan-stack
      - name: Preparar los archivos del análisis
        run: |
          mkdir -p zap && chmod 777 zap
          cp .zap/reglas.tsv zap/reglas.tsv
          curl -fsS http://127.0.0.1:4000/api/docs/openapi.json -o "$RUNNER_TEMP/openapi.json"
          node infra/scripts/security/scan-openapi.ts "$RUNNER_TEMP/openapi.json" \
            zap/openapi.json http://api:4000
      - name: Análisis de la web (ZAP baseline)
        run: |
          docker run --rm --network arza-one-ci_default --volume "$PWD/zap:/zap/wrk" "$ZAP_IMAGE" \
            zap-baseline.py -t http://web:3000 -c reglas.tsv -J web.json -r web.html -I
      - name: Análisis de la API sin sesión (ZAP API scan)
        run: |
          docker run --rm --network arza-one-ci_default --volume "$PWD/zap:/zap/wrk" "$ZAP_IMAGE" \
            zap-api-scan.py -t /zap/wrk/openapi.json -f openapi -c reglas.tsv \
              -J api.json -r api.html -I
      - name: Análisis de la API con sesión (ZAP API scan)
        env:
          SESSION_FILE: ${{ steps.stack.outputs.session-file }}
        run: |
          cookie="$(jq -r .cookie "$SESSION_FILE")"
          csrf="$(jq -r .csrf "$SESSION_FILE")"
          # El reemplazador de ZAP agrega la cookie y el código antifalsificación a cada petición.
          rules="-config replacer.full_list(0).description=sesion"
          rules="$rules -config replacer.full_list(0).enabled=true"
          rules="$rules -config replacer.full_list(0).matchtype=REQ_HEADER"
          rules="$rules -config replacer.full_list(0).matchstr=Cookie"
          rules="$rules -config replacer.full_list(0).regex=false"
          rules="$rules -config replacer.full_list(0).replacement=$cookie"
          rules="$rules -config replacer.full_list(1).description=csrf"
          rules="$rules -config replacer.full_list(1).enabled=true"
          rules="$rules -config replacer.full_list(1).matchtype=REQ_HEADER"
          rules="$rules -config replacer.full_list(1).matchstr=X-CSRF-Token"
          rules="$rules -config replacer.full_list(1).regex=false"
          rules="$rules -config replacer.full_list(1).replacement=$csrf"
          docker run --rm --network arza-one-ci_default --volume "$PWD/zap:/zap/wrk" "$ZAP_IMAGE" \
            zap-api-scan.py -t /zap/wrk/openapi.json -f openapi -c reglas.tsv \
              -J api-sesion.json -r api-sesion.html -I -z "$rules"
      - name: La sesión siguió activa durante el análisis
        env:
          SESSION_FILE: ${{ steps.stack.outputs.session-file }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "cookie: $(jq -r .cookie "$SESSION_FILE")" http://127.0.0.1:4000/v1/auth/session)
          echo "Sesión de análisis: $status"
          test "$status" -eq 200
      - name: Falla con alertas de riesgo alto
        run: |
          reports="zap/web.json zap/api.json zap/api-sesion.json"
          high=$(jq '[.site[]?.alerts[]? | select(.riskcode == "3")] | length' $reports | paste -sd+ | bc)
          jq -r '.site[]?.alerts[]? | "\(.riskdesc): \(.name)"' $reports | sort | uniq -c
          echo "Alertas de riesgo alto: $high"
          test "$high" -eq 0
      - name: Guardar los informes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes-zap
          path: zap/*.html
          retention-days: 30
      - name: Registros de la copia (si algo falló)
        if: failure()
        run: $COMPOSE logs --tail 100 api worker
      - name: Apagar
        if: always()
        run: $COMPOSE down --volumes
